<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c2418">
  <meta name="description" content="South African cartoon flyer — hadida hero. Soft chests only. Coming soon.">
  <title>Flappy Hadida</title>
  <style>
    :root {
      color-scheme: dark;
      --green: #0c2418;
      --green-deep: #07140e;
      --green-mid: #163828;
      --gold: #e2b340;
      --gold-soft: #f3d78a;
      --cream: #f6f0e4;
      --muted: #c9d4c4;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding:
        max(1.5rem, env(safe-area-inset-top))
        max(1.25rem, env(safe-area-inset-right))
        max(1.75rem, env(safe-area-inset-bottom))
        max(1.25rem, env(safe-area-inset-left));
      background:
        radial-gradient(120% 70% at 50% 18%, var(--green-mid), transparent 58%),
        linear-gradient(180deg, #123024 0%, var(--green) 42%, var(--green-deep) 100%);
      color: var(--cream);
      font-family: Georgia, "Palatino Linotype", Palatino, serif;
    }

    main {
      width: min(100%, 24rem);
      text-align: center;
    }

    .mark {
      width: 7.5rem;
      height: 7.5rem;
      margin: 0 auto 1.25rem;
      display: block;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.35rem, 11vw, 3.4rem);
      font-weight: 700;
      letter-spacing: 0.01em;
      line-height: 0.95;
      color: var(--gold-soft);
      text-wrap: balance;
    }

    .rule {
      width: 4.5rem;
      height: 2px;
      margin: 1.15rem auto 1.15rem;
      border: 0;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    p {
      margin: 0 auto;
      max-width: 20rem;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 1.05rem;
      line-height: 1.55;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="56" fill="#123024" stroke="#e2b340" stroke-width="2"/>
      <path fill="#e2b340" d="M28 62c8-18 22-28 38-28 4 0 7 2 8 5 6-3 14-2 20 3 2 2 2 5 0 7-5 4-12 5-18 3 1 4 0 8-3 11-8 8-20 10-32 6-3-1-6-4-7-7-6 1-12-1-15-6-2-3-1-6 2-8 2-6 4-8 7-6z"/>
      <path fill="#0c2418" d="M78 46c6 1 12 5 14 10-7-1-13-4-18-8 1-1 2-2 4-2z"/>
      <path stroke="#f3d78a" stroke-width="2.4" stroke-linecap="round" fill="none" d="M86 44c10 2 18 8 22 8"/>
      <path stroke="#0c2418" stroke-width="1.6" stroke-linecap="round" d="M46 78v10M58 80v12"/>
    </svg>
    <h1>Flappy Hadida</h1>
    <hr class="rule">
    <p>South African cartoon flyer — hadida hero. Soft chests only. Coming soon.</p>
  </main>
</body>
</html>
